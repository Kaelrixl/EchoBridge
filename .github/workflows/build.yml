name: 构建 EchoBridge

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 配置项目
        shell: pwsh
        run: cmake -S . -B build -G 'Visual Studio 17 2022' -A x64
      - name: 构建项目
        shell: pwsh
        run: cmake --build build --config Release
      - name: 显示程序体积
        shell: pwsh
        run: |
          $file = Get-Item build/out/Release/EchoBridge.exe
          Write-Host ('EXE 大小：{0:N2} MB' -f ($file.Length / 1MB))
      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: EchoBridge-win-x64
          path: build/out/Release/EchoBridge.exe
          if-no-files-found: error
